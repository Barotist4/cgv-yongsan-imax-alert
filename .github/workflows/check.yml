name: CGV 용산 IMAX 확인

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cgv-yongsan-imax-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: CGV 확인
        run: npm run check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: 중복 알림 기록 저장
        run: |
          if git diff --quiet -- state.json; then exit 0; fi
          git config user.name "cgv-alert-bot"
          git config user.email "cgv-alert-bot@users.noreply.github.com"
          git add state.json
          git commit -m "중복 알림 상태 갱신"
          git push
