name: CGV 용산 IMAX 확인

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cgv-yongsan-imax-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: CGV 읽기 전용 시간표 API 1회 확인
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = new URL("https://cgv.co.kr/api/v1/booking/searchSiteScnscYmdListBySite");
          url.search = new URLSearchParams({ coCd: "A420", siteNo: "0013" });
          const response = await fetch(url, {
            headers: {
              accept: "application/json",
              "accept-language": "ko-KR,ko;q=0.9",
              referer: "https://cgv.co.kr/cnm/movieBook/cinema"
            }
          });
          console.log(JSON.stringify({ status: response.status, contentType: response.headers.get("content-type") }));
          const body = await response.text();
          console.log(body.slice(0, 1500));
          if (!response.ok) process.exit(1);
          const parsed = JSON.parse(body);
          if (parsed.statusCode !== 0) throw new Error(`CGV 응답 오류: ${parsed.statusCode}`);
          console.log("READ_ONLY_API_OK");
          NODE
